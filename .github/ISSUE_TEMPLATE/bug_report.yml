name: Bug report
description: Report something that does not work as expected
labels: [bug]
body:
  - type: textarea
    id: happened
    attributes:
      label: Description
      description: What the plugin did, and what you expected instead.
    validations:
      required: true

  - type: dropdown
    id: layout
    attributes:
      label: Layout
      options:
        - Full
        - Half Horizontal
        - Half Vertical
        - Quadrant
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - TRMNL (OG)
        - TRMNL (X)
        - TRMNL (BWRY)
        - Frame
        - BYOS
    validations:
      required: true

  - type: textarea
    id: payload
    attributes:
      label: Payload
      description: The JSON you pushed, with personal details replaced.
      render: json
